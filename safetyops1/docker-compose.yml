services:
  postgres:
    image: postgres:16
    container_name: safetyops-postgres
    environment:
      POSTGRES_DB: safetyops
      POSTGRES_USER: safetyops
      POSTGRES_PASSWORD: safetyops_dev_password
    ports:
      - "5432:5432"
    volumes:
      - safetyops_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: safetyops-redis
    ports:
      - "6379:6379"

volumes:
  safetyops_postgres_data:

